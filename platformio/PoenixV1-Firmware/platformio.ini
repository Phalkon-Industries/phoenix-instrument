; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = pHoenix-mainboard-V1
description = "Main firmware for V1 board of pHoenix instrument"
default_envs = main

[env]
platform = nordicnrf52
board = adafruit_feather_nrf52840
build_src_flags = -Werror -Wall -Wdouble-promotion -Wclobbered -Wempty-body -Wuninitialized
framework = arduino
monitor_speed = 115200
check_tool = cppcheck, clangtidy
check_src_filters = +<src/*> +<test/*> +<lib/*> -<.pio/*>
check_flags = 
	clangtidy: --checks=bugprone-*,clang-analyzer-*,cppcoreguidelines-*,misc-*,performance-*,portability-*,readability-*,-cppcoreguidelines-macro-usage,-cppcoreguidelines-avoid-magic-numbers,-readability-magic-numbers
	cppcheck: --enable=all --addon=misra.json --suppress=*:*/.pio/* --suppress=*:*/home/runner/.platformio/packages/* --suppress=unmatchedSuppression --suppress=cstyleCast
debug_tool = jlink
lib_deps = 
	SPI
	Wire
	adafruit/Adafruit NeoPixel@^1.15.1
	robtillaart/AD524X@^0.5.2


[env:main]
build_src_filter = +<*.h> +<main.cpp>


[env:debug]
build_type = debug
build_src_filter = +<*.h> +<main.cpp>


[env:led_example]
build_src_filter = +<*.h> +<examples/led_example.cpp>


[env:adc_example]
build_src_filter = +<*.h> +<examples/adc_example.cpp>

